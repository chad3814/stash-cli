version: 2

updates:
  # The workflows pin actions to commit SHAs, which never move on their own.
  # Dependabot is what keeps those pins current — it rewrites both the SHA and
  # the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # One PR for all action bumps rather than one per action.
    groups:
      actions:
        patterns: ['*']
