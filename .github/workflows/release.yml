name: release

on:
  push:
    tags: ['v*']

# Releases are not interchangeable — never cancel one that is mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the release on the same checks main gets. A tag should never
      # publish an artifact that would have failed CI.
      - run: npm run verify

      - run: npm run build

      # `gh release create file#label` only sets a display label — the asset would
      # still download as stash.js. Copying gives the asset the name it is meant to
      # be installed under.
      - name: Stage the release asset
        run: cp dist/stash.js stash

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" stash --generate-notes
